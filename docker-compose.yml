# Tomoshibi — API stack (api + redis + searxng)
# Ports 7431/7434/7435 — uncommon block to avoid clashing with 3000/8000/8080.
#   7431 api  ·  7434 redis  ·  7435 searxng
# (mcp/web run via npm/npx or per-package compose, not here)
# Run everything:  docker compose up -d
# API only:        docker compose up -d api redis searxng

# Tomoshibi runs as a MONOLITH: the `api` service embeds the Asynq worker
# (DISABLE_WORKER defaults to false), so there is deliberately NO separate
# worker service here. Running a standalone worker alongside the monolith
# would double queue consumption, spawn a second Chrome instance, and let a
# task be processed by a container different from the one serving its status
# — the recipe for the "occasional 404" on /v1/crawl/:id.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "7434:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./packages/api
    ports:
      - "7431:7431"
    # Compose reads ./ .env from this directory, but the API's own .env lives
    # in packages/api/ (that is the working directory godotenv.Load() expects).
    # Without this, BRAVE_SEARCH_API_KEY and friends are silently blank here
    # and every general engine fails — which presents as
    # "all 7 engines failed (last: engine not configured)".
    env_file:
      - ./packages/api/.env
    environment:
      - SERVER_PORT=7431
      # Container-network addresses override anything in env_file.
      - REDIS_URL=redis://redis:6379
      - SERVER_MODE=release
      - SEARXNG_ENDPOINT=http://searxng:8080
      - STEALTH_ENABLED=true
      # SEARCH_NATIVE_ENABLED defaults to true in code; set it in
      # packages/api/.env to A/B the native layer without editing this file.
      #
      # BRAVE_SEARCH_API_KEY and WEBSHARE_API_KEY are deliberately NOT listed
      # here. A ${VAR:-} line interpolates against the compose project
      # directory's .env, which does not exist (the API's .env is one level
      # down), so it resolved to "" and — because `environment` beats
      # `env_file` — silently blanked a key that env_file had correctly
      # loaded. Anything not overridden in-container should come from
      # env_file alone.
      #
      # SEARCH_PROXY_BUDGET_GB is pinned per the project's egress budget.
    volumes:
      # Local-only search telemetry (JSONL) survives container recreation.
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/tomoshibi-api"]
    restart: unless-stopped
    healthcheck:
      # /health is served unauthenticated and returns 200 only once the
      # router is up — a real readiness signal, unlike a bare TCP probe.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7431/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # mcp/web run via npm (npx -y tomoshi) or per-package compose:
  #   docker compose -f packages/mcp/docker-compose.yml up -d
  #   docker compose -f packages/web/docker-compose.yml up -d

  # Self-hosted meta-search backend for /v1/search. Aggregates many engines
  # (Google, Bing, DuckDuckGo, Brave, Mojeek, Wikipedia, ...), so Tomoshibi's
  # search no longer depends on scraping one engine. Free and containerized.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "7435:8080"
    volumes:
      - ./packages/api/deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./packages/api/deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng_data:/var/cache/searxng
    restart: unless-stopped

volumes:
  redis_data:
  searxng_data:

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Tomoshibi — lamp light</title>
  <desc id="desc">Dark banner with a glowing paper lantern and the Japanese word tomoshibi</desc>
  <!-- Background: deep slate -->
  <rect width="1200" height="400" rx="16" fill="#0f172a"/>
  <!-- Subtle radial glow behind lantern -->
  <radialGradient id="glow" cx="50%" cy="55%" r="35%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
    <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="400" rx="16" fill="url(#glow)"/>
  <!-- Lantern: top cap -->
  <rect x="560" y="72" width="80" height="14" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="575" y="62" width="50" height="12" rx="6" fill="#334155"/>
  <!-- Cord -->
  <line x1="600" y1="0" x2="600" y2="62" stroke="#334155" stroke-width="1.5" stroke-dasharray="0"/>
  <!-- Lantern body: paper with warm glow -->
  <rect x="545" y="86" width="110" height="140" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" opacity="0.95"/>
  <!-- Inner glow -->
  <rect x="555" y="96" width="90" height="120" rx="12" fill="#f59e0b" opacity="0.18"/>
  <!-- Vertical ribs -->
  <line x1="575" y1="86" x2="575" y2="226" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="600" y1="86" x2="600" y2="226" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="625" y1="86" x2="625" y2="226" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <!-- Bottom cap -->
  <rect x="560" y="226" width="80" height="14" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Tassel -->
  <line x1="600" y1="240" x2="600" y2="268" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>
  <circle cx="600" cy="272" r="4" fill="#f59e0b" opacity="0.5"/>
  <!-- Japanese vertical: 灯火 -->
  <text x="680" y="118" font-family="serif" font-size="52" fill="#fef3c7" opacity="0.9" letter-spacing="2">灯</text>
  <text x="680" y="175" font-family="serif" font-size="52" fill="#fef3c7" opacity="0.9" letter-spacing="2">火</text>
  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">tomoshibi</text>
  <!-- Tagline -->
  <text x="600" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.08em">灯火 — lamp light  ·  self-hosted search &amp; scraping for AI agents</text>
  <!-- Formerly badge -->
  <text x="600" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569" letter-spacing="0.06em">formerly Cinder  ·  tomoshi CLI alias</text>
</svg>

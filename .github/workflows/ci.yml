name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — a force-push shouldn't leave a
# stale run burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Go module lives in packages/api; there is no go.mod at the repo root.
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go.mod
          cache: true
          cache-dependency-path: packages/api/go.sum

      # Pinned: an unpinned @latest install can turn CI red on a day when
      # nothing in this repo changed.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg ./test)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: staticcheck ./...

      # Chromium is preinstalled on ubuntu-latest runners, so the chromedp
      # tests exercise a real browser rather than skipping.
      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Coverage summary
        run: |
          go test ./internal/... ./pkg/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          # Artifact paths resolve from the workspace root, not the job's
          # working directory.
          path: packages/api/coverage.out

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go.mod
          cache: true
          cache-dependency-path: packages/api/go.sum
      - name: Build binaries
        run: |
          go build -o /tmp/tomoshibi-api ./cmd/api
          go build -o /tmp/tomoshibi-worker ./cmd/worker

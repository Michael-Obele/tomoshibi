name: npm-tomoshi

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp/**"
      - ".github/workflows/npm.yml"
    tags: ["v*", "tomoshi-v*", "mcp-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest, next, beta)"
        required: false
        default: "latest"

permissions:
  contents: write
  id-token: write

jobs:
  version:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bumped: ${{ steps.decide.outputs.bumped }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Workflow-only pushes (like editing this file, which is also in the
      # paths filter) must not burn a version bump — only package content
      # counts as a release.
      - name: Check whether package content changed
        id: content
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- packages/mcp; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No packages/mcp changes in this push — nothing to publish"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Publishable whenever the local version is not on npm yet: either it
      # needs a patch bump, or a commit already bumped it by hand. The
      # hand-bumped case used to be skipped, so that version never shipped.
      - name: Resolve the version to publish
        id: decide
        run: |
          PKG=packages/mcp/package.json
          LOCAL=$(node -p "require('./$PKG').version")
          ALREADY=$(npm view "tomoshi@$LOCAL" version 2>/dev/null || echo "")
          echo "local=$LOCAL on-npm=${ALREADY:-none}"
          if [ "${{ steps.content.outputs.changed }}" != "true" ]; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "version=$LOCAL" >> $GITHUB_OUTPUT
          elif [ -n "$ALREADY" ]; then
            NEW=$(node -e "const [M,m,p]=process.argv[1].split('.').map(Number);console.log(\`\${M}.\${m}.\${p+1}\`)" "$LOCAL")
            echo "Bumping $LOCAL -> $NEW"
            node -e "
              const fs=require('fs');
              const p='$PKG';
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              j.version=process.argv[1];
              fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
            " "$NEW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$PKG"
            git commit -m "chore(mcp): auto-bump to $NEW [skip ci]"
            git push origin HEAD:main
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=$NEW" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=$LOCAL" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: [version]
    # Runs when the version job flagged something to publish, when a tag was
    # pushed, or on manual dispatch. The version job is skipped on tags and
    # dispatch, hence always().
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.version.outputs.publish == 'true' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.bumped == 'true' && 'main' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Skip if this exact version is already on npm
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "tomoshi@$LOCAL" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "tomoshi@$LOCAL is already on npm — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - run: bun install
        if: steps.check.outputs.skip != 'true'

      - run: bun run --cwd packages/mcp typecheck
        working-directory: .
        if: steps.check.outputs.skip != 'true'

      - run: npm run build
        if: steps.check.outputs.skip != 'true'

      - name: Publish to npm with Provenance (OIDC, no token)
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -n "${{ inputs.tag }}" ] && [ "${{ inputs.tag }}" != "latest" ]; then
            npm publish --provenance --access public --tag ${{ inputs.tag }}
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/mcp

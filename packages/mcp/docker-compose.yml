# Tomoshibi MCP — standalone
# Run just the MCP server on 7433 (needs a running API on 7431)
# Usage: docker compose -f packages/mcp/docker-compose.yml up -d
# Or with a remote API: TOMOSHI_API_URL=https://your-api.example.com docker compose -f packages/mcp/docker-compose.yml up -d
services:
  mcp:
    build: .
    ports:
      - "7433:7433"
    environment:
      - PORT=7433
      # TOMOSHI_API_URL is the name the server reads (TOMOSHIBI_API_URL is NOT —
      # config.ts would exit with "TOMOSHI_API_URL is required").
      - TOMOSHI_API_URL=${TOMOSHI_API_URL:-http://host.docker.internal:7431}
      - TOMOSHI_API_KEY=${TOMOSHI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7433/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

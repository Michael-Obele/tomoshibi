# fly.toml app configuration file for tomoshibi-mcp (formerly cinder-tmcp)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tomoshibi-mcp'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

# Secrets (fly secrets set --app tomoshibi-mcp ...):
#   TOMOSHI_API_URL=https://tomoshibi.fly.dev   required
#   BRAVE_SEARCH_API_KEY / SERPER_API_KEY / TAVILY_API_KEY
#     optional; forwarded to the API on every request as X-Tomoshi-Env (the MCP
#     discovers names via GET /v1/env; TOMOSHI_FORWARD_ENV=false opts out)

[env]
  LOG_LEVEL = 'info'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '4s'
    grace_period = '3s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

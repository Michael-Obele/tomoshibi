# Tomoshibi Search — bundled engine roster (registry v1).
#
# Roster is DATA (plan README R5): replace wholesale via SEARCH_ENGINES_PATH.
# Every HTML/API entry below was verified live from this machine on
# 2026-09-26 (evidence: plan/tomoshi-search/research.md §3b). EXCEPTION:
# the keyed APIs `serper`/`tavily` (added 2026-10-05) are contract-verified
# only (vendor docs + auth probes, §3b) and gated by requires_env — their
# first keyed call is the live probe. Engines marked `enabled: false` are
# kept as documented opt-ins (proxy experiments).
#
# Field cheat-sheet:
#   profile: "" = plain net/http | "chrome" = browser TLS fingerprint
#   proxy:   proxy group name (webshare | tier1 | tier2); "" = direct
#   method/body: POST + JSON body for API engines; {{query_json}} = the
#           query escaped as a JSON string, {{query}} = URL-encoded
#   parse.type: css | rss | json
#   field: sel/attr (css) | path (json/rss) | template+encode | urlparam
#           (uddg=ddg redirector | bing_u=bing ck/a | url=news apiclick)
#           | join (segment arrays) | or_template | strip_html
#   site_operator: true = engine honours `site:`/`-site:` in the query, so
#           includeDomains/excludeDomains can be pushed upstream instead of
#           only post-filtered. MEASURED 2026-10-04 (TOMOSHI_LIVE=1):
#             brave      20 results / 20 in-domain  -> ON
#             marginalia  7 results /  7 in-domain  -> ON (throttles on repeat)
#             bing       10 results /  0 in-domain  -> OFF (see note below)
#             ddg        egress anomaly-blocked    -> ON, doc-verified only
#           mwmbl has no verified support. No JSON/RSS API engine can have it:
#           github/npm/wikipedia/mdn would match `site:x` as a literal term.
#           BING IS OFF ON PURPOSE: Bing documents site:, but from datacenter
#           egress it ignored the operator outright. An engine that ignores
#           `site:` does not degrade to neutral — it ranks the injected token
#           as a search term, which hurts. Re-test before re-enabling.
#           Correctness never depends on this flag — the post-filter always runs.
version: 1

# Ranking policy for the roster as a whole (not per engine).
#
# max_per_domain caps how many results ONE engine may contribute from a single
# registrable domain, before fusion. Without it a single high-weighted engine
# can fill an entire page: measured on live output 2026-10-04, one engine held
# 8 of the top 10 slots on a shopping query, because weightFor gives the top
# engine ~1.0 and every other engine's best hit then scores below the leader's
# EIGHTH. Capping matches Google/Bing, which show at most two results from one
# domain per SERP.
#
#   default: 2  general and news. Wikipedia dominating 8/10 was the observed
#               failure; retail/review/forum sources now fill the freed slots.
#   it: 0      UNCAPPED on purpose. GitHub answers a code query with twenty
#               repos, all on github.com — capping those would discard the
#               answer instead of diversifying it.
fusion:
  max_per_domain:
    default: 2
    it: 0

engines:
  # ---------------------------------------------------------------- general
  - name: ddg
    categories: [general]
    weight: 70
    timeout_ms: 5000
    min_interval_ms: 4000 # anomaly page fires on fast repeats (T0 2026-09-26)
    profile: chrome
    site_operator: true # documented operator; egress was anomaly-blocked 2026-10-04
    block_markers: ["detected unusual traffic", "anomaly-modal"]
    request:
      url: "https://html.duckduckgo.com/html/?q={{query}}&kl=us-en"
      headers:
        Accept-Language: "en-US,en;q=0.9"
    parse:
      type: css
      item: "div.results_links"
      fields:
        title: { sel: "a.result__a", attr: text }
        url: { sel: "a.result__a", attr: href, urlparam: uddg }
        content: { sel: "div.result__snippet", attr: text }

  - name: bing
    categories: [general]
    weight: 65
    timeout_ms: 5000
    profile: chrome
    # site_operator stays OFF: measured 10 results / 0 in-domain on 2026-10-04.
    block_markers: ["challenge-form", "captcha"]
    request:
      url: "https://www.bing.com/search?q={{query}}&setlang=en&cc=US&count=20"
      headers:
        Accept-Language: "en-US,en;q=0.9"
    parse:
      type: css
      item: "li.b_algo"
      fields:
        title: { sel: "h2 a", attr: text }
        url: { sel: "h2 a", attr: href, urlparam: bing_u }
        content:
          { sel: ".b_caption p", attr: text, exclude: "a.b_algoReadMore" }

  - name: wikipedia
    categories: [general]
    weight: 85
    timeout_ms: 4000
    request:
      url: "https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=20&srsearch={{query}}&format=json&utf8=1"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: query.search
      fields:
        title: { path: title }
        url:
          { template: "https://en.wikipedia.org/wiki/{{title}}", encode: true }
        content: { path: snippet, strip_html: true }

  - name: wikidata
    categories: [general]
    weight: 55
    timeout_ms: 4000
    request:
      url: "https://www.wikidata.org/w/api.php?action=wbsearchentities&search={{query}}&language=en&format=json&limit=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: search
      fields:
        title: { path: display.label.value, or_template: "{{label}}" }
        url: { template: "https://www.wikidata.org/wiki/{{id}}" }
        content:
          { path: display.description.value, or_template: "{{description}}" }

  - name: marginalia
    categories: [general]
    weight: 50
    timeout_ms: 6000
    site_operator: true # measured 7/7 in-domain 2026-10-04; 200-but-throttled on repeat
    block_markers: ["barraged by queries", "Wait For A Moment"] # 200-but-throttled interstitial
    request:
      url: "https://old-search.marginalia.nu/search?query={{query}}"
    parse:
      type: css
      item: "section.card.search-result"
      fields:
        title: { sel: "h2 a.title", attr: text }
        url: { sel: "h2 a.title", attr: href }
        content: { sel: "p.description", attr: text }

  - name: mwmbl
    categories: [general]
    weight: 45
    # 8s: canary showed a 5004ms spike against otherwise 399–1123ms answers,
    # and the scorecard had 5/8 timeouts under real load (2026-09-27).
    timeout_ms: 8000
    request:
      url: "https://api.mwmbl.org/search/?s={{query}}"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: ""
      fields:
        title: { path: title, join: value }
        url: { path: url }
        content: { path: extract, join: value }

  - name: brave
    categories: [general]
    weight: 75
    timeout_ms: 5000
    requires_env: BRAVE_SEARCH_API_KEY
    site_operator: true # measured 20/20 in-domain 2026-10-04
    request:
      url: "https://api.search.brave.com/res/v1/web/search?q={{query}}&count=20"
      headers:
        Accept: "application/json"
        X-Subscription-Token: "${BRAVE_SEARCH_API_KEY}"
    parse:
      type: json
      item: web.results
      fields:
        title: { path: title }
        url: { path: url }
        content: { path: description }

  # ------------------------------------------------------------ keyed APIs
  # Contract evidence: plan/tomoshi-search/research.md §3b (2026-10-05).
  # requires_env-gated: without a key they report "not configured" and the
  # chain runs exactly as before, so keyless users lose nothing.
  - name: serper
    categories: [general]
    weight: 90
    timeout_ms: 6000
    requires_env: SERPER_API_KEY
    # site_operator OFF until measured — the bing note above applies: a
    # vendor claiming `site:` support is not evidence that it is honoured.
    request:
      method: POST
      url: "https://google.serper.dev/search"
      headers:
        Content-Type: "application/json"
        X-API-KEY: "${SERPER_API_KEY}"
      # q/gl/hl only — every extra param is contract risk until a real-key
      # probe proves it (num deliberately omitted).
      body: '{"q":"{{query_json}}","gl":"us","hl":"en"}'
    parse:
      type: json
      item: organic
      fields:
        title: { path: title }
        url: { path: link }
        content: { path: snippet }

  - name: tavily
    categories: [general]
    weight: 70
    timeout_ms: 6000
    requires_env: TAVILY_API_KEY
    # site_operator OFF: Tavily documents include/exclude_domains params,
    # not `site:` in the raw query.
    request:
      method: POST
      url: "https://api.tavily.com/search"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${TAVILY_API_KEY}"
      # basic = 1 credit per call (free tier: 1,000 credits/mo).
      body: '{"query":"{{query_json}}","max_results":20,"search_depth":"basic"}'
    parse:
      type: json
      item: results
      fields:
        title: { path: title }
        url: { path: url }
        content: { path: content }

  # Opt-in experiments: both need a proxy group (Webshare) before they have
  # a chance from a datacenter/WARP egress — see research.md §3b.
  - name: mojeek
    categories: [general]
    weight: 60
    timeout_ms: 5000
    profile: chrome
    proxy: webshare
    # Retested 2026-10-03 (direct): HTTP 200 but <title>Captcha — unchanged
    # from the 2026-09-27 scorecard (0/6 through Webshare, 403 direct). The
    # block is IP reputation, not markup: the selector set below is
    # unverified because no response has ever contained results. Needs a
    # residential/tier1 exit; do not re-enable against datacenter egress.
    enabled: false
    block_markers: ["403 - forbidden", "<title>captcha", "captcha"]
    request:
      url: "https://www.mojeek.com/search?q={{query}}"
    parse:
      type: css
      item: "ul.results-standard li"
      fields:
        title: { sel: "a.title", attr: text }
        url: { sel: "a.title", attr: href }
        content: { sel: "p.s", attr: text }

  - name: google
    categories: [general]
    weight: 90
    timeout_ms: 5000
    profile: chrome
    proxy: webshare
    # Retested 2026-10-03 (direct, no proxy): HTTP 200, 94KB, title
    # "Google Search", but ZERO results — 0 `div.g`, 0 `h3`, 0 result
    # links, 5 <noscript> markers. It serves a JavaScript shell, so the HTML
    # endpoint is structurally unparseable regardless of IP reputation.
    # Not a parser bug. Enabling would add latency and return nothing.
    enabled: false
    block_markers: ["unusual traffic", "/sorry/", "noscript"]
    request:
      url: "https://www.google.com/search?q={{query}}&num=20&hl=en"
      headers:
        Accept-Language: "en-US,en;q=0.9"
    parse:
      type: css
      item: "div.g"
      fields:
        title: { sel: "h3", attr: text }
        url: { sel: "a", attr: href, urlparam: uddg }
        content: { sel: "div.VwiC3b", attr: text }

  - name: startpage
    categories: [general]
    weight: 40
    timeout_ms: 6000
    profile: chrome
    proxy: webshare
    # Retested 2026-10-03 (direct): HTTP 303 -> /sp/captcha-block?bc=... with
    # geo=NG, i.e. an explicit captcha redirect before any results render.
    # Confirms the 2026-09-27 "consent/cookie dance" note as a hard captcha.
    # Do not re-enable: it costs a round-trip and yields zero rows.
    enabled: false
    block_markers: ["captcha-block", "captcha", "/sorry/"]
    request:
      url: "https://www.startpage.com/sp/search?query={{query}}"
    parse:
      type: css
      item: "div.w-gl__result"
      fields:
        title: { sel: "a.result-title", attr: text }
        url: { sel: "a.result-title", attr: href }
        content: { sel: "div.result-description", attr: text }

  # ------------------------------------------------------------------- news
  - name: bingnews
    categories: [news]
    weight: 80
    timeout_ms: 5000
    # site_operator OFF: same Bing uncertainty as the web engine above.
    request:
      url: "https://www.bing.com/news/search?q={{query}}&format=rss&count=20"
    parse:
      type: rss
      fields:
        title: { path: title }
        url: { path: link, urlparam: url }
        content: { path: description, strip_html: true }
        published: { path: pubDate }

  - name: wikinews
    categories: [news]
    weight: 60
    timeout_ms: 4000
    request:
      url: "https://en.wikinews.org/w/api.php?action=query&list=search&srlimit=20&srsearch={{query}}&format=json&utf8=1"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: query.search
      fields:
        title: { path: title }
        url:
          { template: "https://en.wikinews.org/wiki/{{title}}", encode: true }
        content: { path: snippet, strip_html: true }

  - name: hn
    categories: [news, it]
    weight: 65
    timeout_ms: 5000
    request:
      url: "https://hn.algolia.com/api/v1/search?query={{query}}&tags=story&hitsPerPage=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: hits
      fields:
        title: { path: title }
        url:
          {
            path: url,
            or_template: "https://news.ycombinator.com/item?id={{objectID}}",
          }
        content: { path: story_text }

  # --------------------------------------------------------------------- it
  - name: github
    categories: [it]
    weight: 90
    timeout_ms: 5000
    request:
      url: "https://api.github.com/search/repositories?q={{query}}&per_page=20"
      headers:
        Accept: "application/vnd.github+json"
    parse:
      type: json
      item: items
      fields:
        title: { path: full_name }
        url: { path: html_url }
        content: { path: description }

  - name: stackexchange
    categories: [it]
    weight: 85
    timeout_ms: 5000
    request:
      url: "https://api.stackexchange.com/2.2/search/advanced?order=desc&sort=relevance&q={{query}}&site=stackoverflow&pagesize=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: items
      fields:
        title: { path: title, strip_html: true }
        url: { path: link }
        content: { path: body, strip_html: true }

  - name: mdn
    categories: [it]
    weight: 70
    timeout_ms: 4000
    request:
      url: "https://developer.mozilla.org/api/v1/search?q={{query}}&locale=en-us"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: documents
      fields:
        title: { path: title }
        url: { template: "https://developer.mozilla.org{{mdn_url}}" }
        content: { path: summary }

  - name: npm
    categories: [it]
    weight: 60
    timeout_ms: 4000
    request:
      url: "https://registry.npmjs.org/-/v1/search?text={{query}}&size=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: objects
      fields:
        title: { path: package.name }
        url: { template: "https://www.npmjs.com/package/{{package.name}}" }
        content: { path: package.description }

  - name: crates
    categories: [it]
    weight: 55
    timeout_ms: 4000
    request:
      url: "https://crates.io/api/v1/crates?q={{query}}&per_page=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: crates
      fields:
        title: { path: id }
        url: { template: "https://crates.io/crates/{{id}}" }
        content: { path: description }

  - name: packagist
    categories: [it]
    weight: 45
    timeout_ms: 4000
    request:
      url: "https://packagist.org/search.json?q={{query}}&per_page=20"
      headers:
        Accept: "application/json"
    parse:
      type: json
      item: results
      fields:
        title: { path: name }
        url: { path: url }
        content: { path: description }

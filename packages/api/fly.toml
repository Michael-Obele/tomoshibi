# fly.toml app configuration file generated for tomoshibi on 2026-09-16T12:35:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tomoshibi'
primary_region = 'cdg'
kill_timeout = '25s'

[build]
  dockerfile = 'Dockerfile'

[env]
  GIN_MODE = 'release'
  LOG_LEVEL = 'info'
  SERVER_MODE = 'release'
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tomoshibi">
  <!-- Background: deep slate (matches banner) -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Subtle radial glow behind lantern -->
  <radialGradient id="glow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
  </radialGradient>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <!-- Lantern top cap -->
  <rect x="26" y="8" width="12" height="3" rx="1.5" fill="#334155"/>
  <!-- Cord -->
  <line x1="32" y1="3" x2="32" y2="8" stroke="#334155" stroke-width="1"/>
  <!-- Lantern body: paper with warm glow -->
  <rect x="22" y="11" width="20" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8" opacity="0.95"/>
  <!-- Inner glow -->
  <rect x="24.5" y="14" width="15" height="22" rx="3.5" fill="#f59e0b" opacity="0.2"/>
  <!-- Vertical ribs -->
  <line x1="27" y1="11" x2="27" y2="39" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <line x1="32" y1="11" x2="32" y2="39" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <line x1="37" y1="11" x2="37" y2="39" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  <!-- Lantern bottom cap -->
  <rect x="26" y="39" width="12" height="3" rx="1.5" fill="#334155"/>
  <!-- Tassel -->
  <line x1="32" y1="42" x2="32" y2="49" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <circle cx="32" cy="51" r="1.8" fill="#f59e0b" opacity="0.5"/>
  <!-- 灯 character (lamp) -->
  <text x="32" y="59" text-anchor="middle" font-family="serif" font-size="8" fill="#fef3c7" opacity="0.85">灯</text>
</svg>
